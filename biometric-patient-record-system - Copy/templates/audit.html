{% extends "base.html" %}
{% block content %}
<div class="page-heading">
  <div>
    <span class="eyebrow">Security</span>
    <h1>Audit Log</h1>
  </div>
</div>
<section class="panel">
  <table>
    <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Details</th></tr></thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.created_at }}</td>
        <td>{{ log.actor }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.details }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
